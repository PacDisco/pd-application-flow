<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apply — Pacific Discovery</title>
<meta name="description" content="Apply to a Pacific Discovery gap semester, mini semester or summer program.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--topaz:#55bbd2;--teal:#288195;--teal-dk:#1f6b7c;--green:#81c243;--green-dk:#4f7f22;--ink:#212121;--body:#4a4a4a;--muted:#5f666b;--line:#e1e6e8;--bg:#f4f6f7;--card:#fff;--soft:#eef6f8;--bad:#a8321d;--bad-bg:#fdecea;--ok:#3c6b14;--ok-bg:#e9f5dd}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--body);background:var(--bg);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
h1,h2,h3{color:var(--ink);margin:0}
.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{background:var(--teal);color:#fff}
.top__in{max-width:880px;margin:0 auto;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:34px;width:auto;display:block}
.top a{color:#fff;font-size:14px;text-decoration:none;opacity:.9}
.top a:hover{opacity:1;text-decoration:underline}
.embedded .top{display:none}
.top .short{display:none}
@media (max-width:520px){.top .long{display:none}.top .short{display:inline}}
.wrap{max-width:880px;margin:0 auto;padding:22px 16px 64px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;list-style:none;padding:0;margin:0 0 20px;counter-reset:s}
.steps li{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.steps li::before{content:"";height:6px;border-radius:999px;background:#d7dee1}
.steps li[data-state=done]{color:var(--teal)}
.steps li[data-state=done]::before{background:var(--teal)}
.steps li[data-state=current]{color:var(--ink)}
.steps li[data-state=current]::before{background:linear-gradient(90deg,var(--topaz),var(--teal))}
.steps .n{font-weight:500;color:var(--muted);font-size:12px}
@media (max-width:520px){.steps li span.t{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 28px 24px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
@media (max-width:600px){.card{padding:20px 16px;border-radius:12px}}
.card h1{font-size:34px;line-height:1.15;margin-bottom:8px}
@media (max-width:600px){.card h1{font-size:28px}}
.lead{color:var(--muted);margin:0 0 24px}
.actions{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:8px;padding-top:20px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn:focus-visible{outline:3px solid rgba(85,187,210,.6);outline-offset:2px}
.btn--primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn--primary:hover{background:var(--teal-dk);border-color:var(--teal-dk)}
.btn--go{background:var(--green-dk);border-color:var(--green-dk);color:#fff}
.btn--go:hover{background:#3f6a19}
.btn[disabled]{opacity:.6;cursor:progress}
.link{background:none;border:0;padding:0;color:var(--teal);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline}
.banner{border-radius:12px;padding:12px 16px;margin:0 0 18px;font-size:15px}
.banner--bad{background:var(--bad-bg);color:var(--bad)}
.banner--ok{background:var(--ok-bg);color:var(--ok)}
.banner--info{background:var(--soft);color:var(--teal-dk)}
.hello{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:0 0 14px}
.pill{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;background:var(--soft);color:var(--teal-dk);font-weight:600;font-size:13px}
.meet{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;min-height:680px}
.meet iframe{display:block;width:100%;height:760px;border:0}
@media (max-width:600px){.meet iframe{height:900px}}
.booked{display:flex;gap:14px;align-items:flex-start;background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:16px 18px;margin:0 0 18px}
.booked strong{display:block;color:#2c520d}
.fee{width:100%;border-collapse:collapse;margin:0 0 20px;font-size:16px}
.fee td{padding:12px 0;border-bottom:1px solid var(--line)}
.fee td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fee tr.total td{font-weight:700;color:var(--ink);border-bottom:0;font-size:18px}
.small{font-size:13px;color:var(--muted)}
.done{text-align:center;padding:12px 0}
.done .tick{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:inline-flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:12px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
.btn:not(.btn--primary):not(.btn--go) .spin{border-color:rgba(0,0,0,.15);border-top-color:var(--teal)}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.foot{max-width:880px;margin:0 auto;padding:0 16px 40px;font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top__in">
    <a href="https://www.pacificdiscovery.org" aria-label="Pacific Discovery home"><img src="/pacific-discovery-logo.png" alt="Pacific Discovery" width="142" height="34"></a>
    <a href="mailto:info@pacificdiscovery.org"><span class="long">Questions? info@pacificdiscovery.org</span><span class="short">Contact us</span></a>
  </div>
</header>

<main class="wrap" id="main" tabindex="-1">
  <ol class="steps" id="steps" aria-label="Application progress">
    <li data-step="step1"><span class="n">Step 1</span><span class="t">About you</span></li>
    <li data-step="step2"><span class="n">Step 2</span><span class="t">Application</span></li>
    <li data-step="interview"><span class="n">Step 3</span><span class="t">Interview</span></li>
    <li data-step="payment"><span class="n">Step 4</span><span class="t">Application fee</span></li>
  </ol>
  <div id="banner" role="status" aria-live="polite"></div>
  <section class="card" id="view" aria-live="polite">
    <div class="loading">Loading your application…</div>
  </section>
</main>
<p class="foot">Pacific Discovery · Your information is sent securely and only used to process your application.</p>

<script type="module" src="/app.js"></script>
</body>
</html>
