<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Program Terms &amp; Conditions — Pacific Discovery</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#288195;--ink:#212121;--body:#4a4a4a;--bg:#f4f6f7;--line:#e1e6e8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--body);background:var(--bg);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
.top{background:var(--teal)}
.top__in{max-width:880px;margin:0 auto;padding:18px 16px}
.top img{height:34px;width:auto;display:block}
.wrap{max-width:880px;margin:0 auto;padding:24px 16px 64px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 24px}
h1,h2,h3{color:var(--ink);font-family:'DM Serif Display',Georgia,serif;font-weight:400}
#pd-terms h1{font-size:30px}#pd-terms h2{font-size:22px}#pd-terms h3{font-size:18px}
@media (max-width:520px){.card{padding:20px 16px}}
</style>
</head>
<body>
<header class="top"><div class="top__in"><a href="https://www.pacificdiscovery.org"><img src="/pacific-discovery-logo.png" alt="Pacific Discovery"></a></div></header>
<main class="wrap"><div class="card"><div id="pd-terms"><p>Loading…</p></div></div></main>
<script src="/terms-embed.js" defer></script>
</body>
</html>
