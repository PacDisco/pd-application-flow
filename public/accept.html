<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Confirm your place — Pacific Discovery</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--topaz:#55bbd2;--teal:#288195;--teal-dk:#1f6b7c;--green:#81c243;--green-dk:#4f7f22;--ink:#212121;--body:#4a4a4a;--muted:#5f666b;--line:#e1e6e8;--bg:#f4f6f7;--card:#fff;--soft:#eef6f8;--bad:#a8321d;--bad-bg:#fdecea;--ok:#3c6b14;--ok-bg:#e9f5dd}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--body);background:var(--bg);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
h1,h2,h3{color:var(--ink);margin:0}
.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
.top{background:var(--teal)}
.top__in{max-width:820px;margin:0 auto;padding:18px 16px}
.top img{height:34px;width:auto;display:block}
.wrap{max-width:820px;margin:0 auto;padding:22px 16px 64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 28px 24px;margin-bottom:16px}
@media (max-width:600px){.card{padding:20px 16px;border-radius:12px}}
.card h1{font-size:34px;line-height:1.15;margin-bottom:8px}
@media (max-width:600px){.card h1{font-size:28px}}
.card h2{font-size:20px;margin:0 0 12px}
.lead{color:var(--muted);margin:0 0 20px}
.small{font-size:13px;color:var(--muted)}
.sum{width:100%;border-collapse:collapse;font-size:15px}
.sum td{padding:9px 0;border-bottom:1px solid var(--line)}
.sum td:last-child{text-align:right;white-space:nowrap}
.sum tr.total td{font-weight:700;color:var(--ink);border-bottom:0}
.opts{display:grid;gap:10px;margin:0 0 10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--topaz)}
.opt input{margin-top:5px;accent-color:var(--teal);width:18px;height:18px}
.opt[data-on=true]{border-color:var(--teal);background:var(--soft)}
.opt .t{font-weight:600;color:var(--ink)}
.opt .d{font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;color:#fff;background:var(--green-dk);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.tag--save{background:#fff1e3;color:#8a4100;box-shadow:inset 0 0 0 1px #e9a25b}
.tag--best{background:#a64f00}
.opt--best{border-color:#e9a25b;background:#fff8f0}
.opt--best:hover{border-color:#a64f00}
.opt--best[data-on=true]{border-color:#a64f00;background:#fff1e3}
.opt--best .save{display:block;margin-top:4px;font-size:15px;font-weight:700;color:#8a4100}
.quiet{background:none;border:0;padding:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
.sched{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 0}
.sched td{padding:6px 0;border-bottom:1px dashed var(--line)}
.sched td:last-child{text-align:right}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
@media (max-width:520px){.methods{grid-template-columns:1fr}}
.agree{display:flex;gap:10px;align-items:flex-start;margin:16px 0;font-size:15px}
.agree input{margin-top:4px;width:18px;height:18px;accent-color:var(--teal)}
.pay{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.pay .amt{font-size:22px;font-weight:700;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn--go{background:var(--green-dk);border-color:var(--green-dk);color:#fff}
.btn--go:hover{background:#3f6a19}
.btn--line{border:2px solid var(--teal);color:var(--teal)}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.banner{border-radius:12px;padding:12px 16px;margin:0 0 16px;font-size:15px}
.banner--bad{background:var(--bad-bg);color:var(--bad)}
.banner--ok{background:var(--ok-bg);color:var(--ok)}
.banner--info{background:var(--soft);color:var(--teal-dk)}
.advisor{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.loading{color:var(--muted)}
.tick{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:12px}
.st{font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px}
.st--paid{background:var(--ok-bg);color:var(--ok)}.st--failed,.st--needs_admissions{background:var(--bad-bg);color:var(--bad)}.st--cancelled{background:#eee;color:#666}.st--charging{background:#fff4e0;color:#8a4b00}.st--scheduled,.st--due{background:var(--soft);color:var(--teal-dk)}.st--processing{background:#fff4e0;color:#8a4b00}
</style>
</head>
<body>
<header class="top"><div class="top__in"><a href="https://www.pacificdiscovery.org"><img src="/pacific-discovery-logo.png" alt="Pacific Discovery"></a></div></header>
<main class="wrap">
  <div id="banner" role="status" aria-live="polite"></div>
  <div id="view"><section class="card"><p class="loading">Loading your offer…</p></section></div>
</main>
<script type="module" src="/accept.js"></script>
</body>
</html>
